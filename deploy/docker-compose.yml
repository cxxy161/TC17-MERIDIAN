services:
  meridian:
    image: meridian:latest
    container_name: meridian
    env_file:
      - .env
    # 对外监听 18420（容器内绑定 0.0.0.0:18420；若只走本机 Caddy 可改回 127.0.0.1:18420:18420）
    ports:
      - "18420:18420"
    volumes:
      - ./data:/app/data
    # 非 root 运行。宿主数据目录需要可写：
    #   mkdir -p data && sudo chown -R 10001:10001 data
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      # 运行时镜像 debian:bookworm-slim 自带 bash/grep；用 /dev/tcp 探 /api/health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18420 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
